name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution, and replace "e2e" with "e2e-ci" in the command below
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: hashicorp/setup-terraform@v3

      - run: npm ci
      - run: uv sync --all-packages --frozen
      - run: npx playwright install --with-deps
      - run: docker compose up -d --wait control-postgres warehouse-postgres clickhouse cube
      - run: npm exec -- nx run postgres:migrate
        env:
          DATABASE_OWNER_URL: postgresql+psycopg://zentra_owner:zentra_owner@localhost:5432/zentra_control
      - run: uv run python tools/architecture/verify_known_bad_boundary.py
      - run: npm exec -- nx run docs:check
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate
      - run: >-
          terraform -chdir=infra/terraform plan
          -refresh=false
          -input=false
          -lock=false
          -var clickhouse_allowed_cidr=203.0.113.10/32
          -var clickhouse_owner_password=phase0-validation-placeholder
        env:
          NEON_API_KEY: phase0-validation-placeholder
          CLICKHOUSE_TOKEN_KEY: phase0-validation-placeholder
          CLICKHOUSE_TOKEN_SECRET: phase0-validation-placeholder
          CLICKHOUSE_ORG_ID: 00000000-0000-0000-0000-000000000000

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      # - run: npx nx-cloud record -- echo Hello World
      - run: npm exec -- nx run-many -t lint test build typecheck e2e
        env:
          TEST_DATABASE_OWNER_URL: postgresql+psycopg://zentra_owner:zentra_owner@localhost:5432/zentra_control
          TEST_DATABASE_RUNTIME_URL: postgresql+psycopg://zentra_app:zentra_app@localhost:5432/zentra_control
          TEST_CLICKHOUSE_HOST: localhost
          TEST_CLICKHOUSE_PORT: '8123'
          TEST_CUBE_URL: http://localhost:4000
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: npm exec -- nx fix-ci
        if: always()
      - run: docker compose logs --no-color
        if: failure()
