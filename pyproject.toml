[project]
name = "nx-workspace"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "zentra-adapter-clickhouse",
  "zentra-adapter-cube",
  "zentra-adapter-postgres",
  "zentra-adapter-telemetry",
  "zentra-api",
  "zentra-domain-agent-execution"
]

[tool.uv.workspace]
members = [
  "apps/api",
  "libs/adapters/clickhouse",
  "libs/adapters/cube",
  "libs/adapters/postgres",
  "libs/adapters/telemetry",
  "libs/domain/agent-execution"
]

[tool.uv.sources.zentra-adapter-clickhouse]
workspace = true

[tool.uv.sources.zentra-adapter-cube]
workspace = true

[tool.uv.sources.zentra-adapter-postgres]
workspace = true

[tool.uv.sources.zentra-adapter-telemetry]
workspace = true

[tool.uv.sources.zentra-api]
workspace = true

[tool.uv.sources.zentra-domain-agent-execution]
workspace = true

[dependency-groups]
dev = [
  "autopep8>=2.3.1",
  "import-linter>=2.9,<3",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov"

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [ "E", "F", "UP", "B", "SIM", "I" ]
ignore = [ ]
fixable = [ "ALL" ]
unfixable = [ ]
