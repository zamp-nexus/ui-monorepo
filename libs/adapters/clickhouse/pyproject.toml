[tool.coverage.run]
branch = true
source = [ "src" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
"""

[project]
name = "zentra-adapter-clickhouse"
version = "1.0.0"
description = "Nexus ClickHouse audit adapter"
requires-python = ">=3.13,<3.14"
readme = 'README.md'
dependencies = [
    "clickhouse-connect>=0.8,<1",
    "cryptography>=43,<48",
    "pyarrow>=18,<22",
    "pydantic>=2.12,<3",
    "zentra-application-connector",
    "zentra-domain-connector",
]


[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []

[tool.uv.sources]
zentra-application-connector = { workspace = true }
zentra-domain-connector = { workspace = true }
