[tool.coverage.run]
branch = true
source = [ "src" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
"""

[project]
name = "zentra-adapter-postgres"
version = "1.0.0"
description = "ZentraOS Postgres control-plane adapter"
requires-python = ">=3.13,<3.14"
readme = 'README.md'
dependencies = [
    "alembic>=1.17,<2",
    "greenlet>=3.2,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "zentra-application-investigation",
    "zentra-application-sequence",
    "zentra-domain-agent-execution",
    "zentra-domain-connector",
    "zentra-domain-investigation",
    "zentra-domain-sequence",
]


[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []

[tool.uv.sources]
zentra-domain-agent-execution = { workspace = true }
zentra-application-investigation = { workspace = true }
zentra-application-sequence = { workspace = true }
zentra-domain-connector = { workspace = true }
zentra-domain-investigation = { workspace = true }
zentra-domain-sequence = { workspace = true }
