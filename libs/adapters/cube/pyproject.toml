[tool.coverage.run]
branch = true
source = [ "src" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
"""

[project]
name = "zentra-adapter-cube"
version = "1.0.0"
description = "ZentraOS Cube semantic-layer adapter"
requires-python = ">=3.13,<3.14"
readme = 'README.md'
dependencies = [
    "httpx>=0.28,<1",
    "zentra-application-investigation",
    "zentra-domain-investigation",
]


[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []

[tool.uv.sources]
zentra-application-investigation = { workspace = true }
zentra-domain-investigation = { workspace = true }
