[tool.coverage.run]
branch = true
source = [ "src" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
# The root pyproject declares this, but a lib directory is its own config
# root, so it must be restated here for the async service tests to run.
asyncio_mode = "auto"
addopts = """
 --cov
 --cov-report html:'../../../coverage/libs/application/sequence/html'
 --cov-report xml:'../../../coverage/libs/application/sequence/coverage.xml'
 --html='../../../reports/libs/application/sequence/unittests/html/index.html'
 --junitxml='../../../reports/libs/application/sequence/unittests/junit.xml'
"""

[project]
name = "zentra-application-sequence"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.13,<3.14"
readme = 'README.md'
dependencies = [
    "zentra-domain-sequence",
    "zentra-domain-agent-execution",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []

[tool.uv.sources]
zentra-domain-sequence = { workspace = true }
zentra-domain-agent-execution = { workspace = true }
